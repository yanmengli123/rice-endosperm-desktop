name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned libsodium
        shell: pwsh
        run: ./.github/scripts/prepare-libsodium.ps1
      - name: Build pinned WISP workflow worker
        shell: pwsh
        run: ./.github/scripts/prepare-workflow-worker.ps1
      - name: Verify updater signing credentials
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for signed updater artifacts."
          }
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 稻芯智析 v__VERSION__
          releaseBody: |
            稻芯智析 Windows 桌面客户端。

            - 普通用户推荐下载 `x64-setup.exe`。
            - 企业分发可使用 `.msi`。
            - 首次启动需填写你自己的 Yuxi API Key 与网关地址。
            - 本地科研工作流包含独立 WISP Worker；其固定源码提交、SHA-256 与 AGPL-3.0 许可证随安装包提供。

            完整变更与安全说明见仓库 README。安装包由公开源码自动构建；当前若未配置 Authenticode 证书，Windows 可能提示未知发布者。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          assetNamePattern: Daoxin-Zhixi_[version]_[arch][setup].[ext]
          retryAttempts: 2
          args: --bundles nsis,msi --config src-tauri/tauri.release.conf.json
      - name: Publish updater manifest and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/publish-release-metadata.ps1
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
