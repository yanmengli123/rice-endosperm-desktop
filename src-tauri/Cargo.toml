[package]
name = "rice-endosperm-desktop"
version = "0.4.5"
description = "稻芯智析——水稻胚乳科研智能问答桌面客户端"
authors = ["Rice Endosperm AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rice_endosperm_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread", "process", "io-util"] }
futures-util = "0.3.33"
eventsource-stream = "0.2.3"
thiserror = "2.0.19"
zeroize = "1.9.0"
secrecy = "0.10.3"
sha2 = "0.10.9"
base64 = "0.22"
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
url = "2.5.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
csv = "1.3"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
